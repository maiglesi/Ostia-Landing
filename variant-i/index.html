<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostia - Variant I</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scanline"></div>
    <div class="terminal">
        <header>
            <div class="sys-id">SYS.ID: OSTIA-2026</div>
            <button id="theme-toggle">[ SWITCH_THEME ]</button>
        </header>

        <main>
            <div class="output">
                <span class="prompt">></span> INITIATING PROTOCOL...<br>
                <span class="prompt">></span> AGENTS ONLINE.<br>
                <span class="prompt">></span> <br>
            </div>
            <h1>THE_FUTURE</h1>
            <p class="mission">
                "The future of how work will be done in the world of agentic AI for all roles."
            </p>
            <div class="status-grid">
                <div class="stat-box">
                    <span class="label">EFFICIENCY</span>
                    <div class="bar"><div class="fill" style="width: 98%"></div></div>
                </div>
                <div class="stat-box">
                    <span class="label">AUTONOMY</span>
                    <div class="bar"><div class="fill" style="width: 85%"></div></div>
                </div>
            </div>
        </main>

        <footer>
            <span>(c) 2026 Ostia, Inc.</span>
            <span>NO SIGNAL</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
