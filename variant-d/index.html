<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostia | Variant D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cursor-dot"></div>
    
    <header>
        <div class="logo">Ostia.</div>
        <div class="header-controls">
            <div class="theme-menu">
                <span class="theme-opt" onclick="changePalette('atelier')">Atelier</span>
                <span class="theme-opt" onclick="changePalette('alabaster')">Alabaster</span>
                <span class="theme-opt" onclick="changePalette('linen')">Linen</span>
            </div>
            <button class="dark-toggle" id="theme-toggle">Dark Mode</button>
        </div>
    </header>

    <main>
        <section class="hero-asym">
            <div class="hero-text">
                <h1 class="stagger-text">The future of how work will be done</h1>
                <h1 class="stagger-text indent">in the world of agentic AI</h1>
                <h1 class="stagger-text indent-2">for all roles.</h1>
            </div>
            <div class="hero-abstract">
                <div class="shape circle"></div>
                <div class="shape rect"></div>
            </div>
        </section>

        <section class="manifesto">
            <p class="big-lead scroll-reveal">
                We are building the <span class="highlight">neural fabric</span> of the enterprise. 
                Where agents don't just perform tasks -- they <span class="highlight">inhabit</span> them.
            </p>
            <div class="btn-container scroll-reveal">
                <a href="#" class="btn-outline">Join the Vanguard</a>
            </div>
        </section>
    </main>


    <footer class="site-footer">
        <span>(c) 2026 Ostia, Inc.</span>
        <span>Status: Operational</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
